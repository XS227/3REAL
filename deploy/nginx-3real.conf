# ─────────────────────────────────────────────────────────────────────────────
# 3REAL — Nginx reverse proxy configuration
#
# Install:
#   cp deploy/nginx-3real.conf /etc/nginx/sites-available/3real
#   ln -sf /etc/nginx/sites-available/3real /etc/nginx/sites-enabled/3real
#   nginx -t && systemctl reload nginx
#
# Phase 10.5: no domain attached yet — access via server IP on port 80.
# When the domain is live, update server_name and add the Certbot TLS block.
# ─────────────────────────────────────────────────────────────────────────────

upstream nextjs_3real {
    server 127.0.0.1:3010;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # ── Phase 10.5: placeholder — replace with real domain when DNS is live ──
    # server_name 3real.no www.3real.no;
    # To serve on IP only (no domain), use _ as a catch-all:
    server_name _;

    # ── Upload size (proof files, KYC documents) ─────────────────────────────
    client_max_body_size 20M;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Next.js static assets — served directly by Nginx, bypassing Node ─────
    location /_next/static/ {
        alias /var/www/3real/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Public folder (favicon, robots.txt, etc.) ────────────────────────────
    location /public/ {
        alias /var/www/3real/public/;
        expires 7d;
        access_log off;
    }

    # ── Health check endpoint (no proxy buffering, fast response) ────────────
    location /api/health {
        proxy_pass http://nextjs_3real;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ── Main application proxy ────────────────────────────────────────────────
    location / {
        proxy_pass http://nextjs_3real;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR in dev; keep for SSE / future WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client IP to the app (used by rate limiting + audit logs)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;

        # Timeouts — Next.js server-side renders can take a moment on cold start
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;
}

# ─────────────────────────────────────────────────────────────────────────────
# TLS / HTTPS — add this block after running:
#   certbot --nginx -d 3real.no -d www.3real.no
#
# Certbot will modify the server block above and append a redirect:
#
# server {
#     listen 80;
#     server_name 3real.no www.3real.no;
#     return 301 https://$host$request_uri;
# }
#
# The HTTPS server block with ssl_certificate paths will be generated
# automatically by Certbot. No manual edits needed beyond the initial
# --nginx run.
# ─────────────────────────────────────────────────────────────────────────────
